<!DOCTYPE html>
<html lang="no">

<head>
  <meta charset="UTF-8" />

  <title>Rasmus Dalby</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {

      color: #e2e8f0;
      background: radial-gradient(1200px 600px at 50% -10%, #1e293b 0%, #0f172a 40%, #020617 100%);
      min-height: 100vh;
    }

    .side {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 24px;
    }

    .banner {
      height: 360px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(100, 116, 139, 0.4);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      margin-bottom: 24px;
    }

    .banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .tittel {

    }

    .undertittel {
      color: #38bdf8;

      margin-top: 2px;
    }

    .intro {
      color: #cbd5e1;

      margin-top: 10px;
      line-height: 1.6;
    }

    .seksjon {
      margin-bottom: 24px;
    }

    .seksjon-tittel {


      margin-bottom: 10px;
    }

    .rutenett {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(3, 1fr);
    }

    .kort {
      display: block;
      padding: 16px;
      border-radius: 12px;
      background: rgba(30, 41, 59, 0.6);
      border: 1px solid rgba(100, 116, 139, 0.4);
      text-decoration: none;
      color: #e2e8f0;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .kort:hover {
      transform: translateY(-4px);
      border-color: rgba(56, 189, 248, 0.6);
    }

    .kort-tittel {

    }

    .kort-under {
      color: #94a3b8;

      margin-top: 2px;
    }

    .boks {
      padding: 12px;
    }
  </style>
</head>
